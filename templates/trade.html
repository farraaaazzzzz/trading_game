<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.6" />
    <title>Trade</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin-left: 50px;
        margin-right: 50px;
      }
      .container {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
        margin-bottom: 20px;
      }
      .left,
      .right {
        width: 45%;
      }
      .headline {
        font-size: 20px;
        font-weight: bold;
      }
      .ticker button {
        padding: 10px;
        margin: 5px;
      }
      #timer {
        font-size: 20px;
        font-weight: bold;
      }
      .total {
        margin-top: 10px;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: bold;
      }
      table {
        width: 65%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }
      .center {
        text-align: center;
        margin-bottom: 20px;
      }
      .center p {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="center">
      <h1>FYP-Faraz-Hassan</h1>
      <p>User: {{ username }}</p>
      <p>Turn: {{ turn }} / 10</p>
      <p id="timer">Time Left: 01:45</p>
    </div>
    <div class="container">
      <div class="left">
        <img
          id="stock-image"
          src="{{ stock_data['MSFT']['image'] }}"
          alt="Stock Image"
          width="100%"
        />
      </div>
      <div class="right">
        <div class="headline">
          <p>{{ headline }}</p>
        </div>
        <div>
          <p>Capital: $<span id="capital">{{ capital }}</span></p>
        </div>
        <div class="ticker">
          <button onclick="selectTicker('MSFT')">
            MSFT: $<span id="price-MSFT"
              >{{ stock_data['MSFT']['price'] }}</span
            >
          </button>
          <button onclick="selectTicker('AAPL')">
            AAPL: $<span id="price-AAPL"
              >{{ stock_data['AAPL']['price'] }}</span
            >
          </button>
          <button onclick="selectTicker('GOOG')">
            GOOG: $<span id="price-GOOG"
              >{{ stock_data['GOOG']['price'] }}</span
            >
          </button>
          <button onclick="selectTicker('TSLA')">
            TSLA: $<span id="price-TSLA"
              >{{ stock_data['TSLA']['price'] }}</span
            >
          </button>
        </div>
        <div class="total">Total: $<span id="total-price">0.00</span></div>
        <button onclick="trade('Buy')">Buy</button>
        <input
          type="number"
          id="quantity"
          value="1"
          min="1"
          oninput="updateTotal()"
        />
        <button onclick="trade('Sell')">Sell</button>

        <h3>Stock Holdings</h3>
        <table>
          <tr>
            <th>Stock</th>
            <th>Quantity Owned</th>
          </tr>
          <tr>
            <td>MSFT</td>
            <td id="holdings-MSFT">0</td>
          </tr>
          <tr>
            <td>AAPL</td>
            <td id="holdings-AAPL">0</td>
          </tr>
          <tr>
            <td>GOOG</td>
            <td id="holdings-GOOG">0</td>
          </tr>
          <tr>
            <td>TSLA</td>
            <td id="holdings-TSLA">0</td>
          </tr>
        </table>
      </div>
    </div>
    <script>
      let selectedTicker = "MSFT";
      let holdings = { MSFT: 0, AAPL: 0, GOOG: 0, TSLA: 0 };

      function selectTicker(ticker) {
        selectedTicker = ticker;
        document.getElementById(
          "stock-image"
        ).src = `/static/turn{{ turn }}/${ticker}.png`;
        updateTotal();
      }

      function updateTotal() {
        const quantity = parseInt(
          document.getElementById("quantity").value,
          10
        );
        const price = parseFloat(
          document.getElementById(`price-${selectedTicker}`).innerText
        );
        const total = isNaN(quantity) || isNaN(price) ? 0 : quantity * price;
        document.getElementById("total-price").innerText = total.toFixed(2);
      }

      function trade(action) {
        const quantity = parseInt(
          document.getElementById("quantity").value,
          10
        );
        if (isNaN(quantity) || quantity <= 0) {
          alert("Please enter a valid quantity greater than 0.");
          return;
        }
        fetch("/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: "{{ username }}",
            action,
            ticker: selectedTicker,
            quantity,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("capital").innerText = data.capital;
            holdings[selectedTicker] += action === "Buy" ? quantity : -quantity;
            document.getElementById(`holdings-${selectedTicker}`).innerText =
              holdings[selectedTicker];
            updateTotal();
          })
          .catch((error) => alert("An error occurred: " + error.message));
      }

      function startTimer() {
        const timerElement = document.getElementById("timer");
        let timeLeft = 105;
        const interval = setInterval(() => {
          if (timeLeft <= 0) {
            clearInterval(interval);
            alert("Time's up! Moving to the next round...");
            fetch("/next-turn", { method: "POST" })
              .then((response) => response.json())
              .then((data) => {
                if (data.message === "Game Over") {
                  alert("Game Over! Thanks for playing.");
                  location.href = "/";
                } else {
                  location.reload();
                }
              })
              .catch((error) => alert("An error occurred: " + error.message));
          } else {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.innerText = `Time Left: ${minutes
              .toString()
              .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
          }
        }, 1000);
      }

      window.onload = () => {
        startTimer();
        updateTotal();
      };
    </script>
  </body>
</html>
