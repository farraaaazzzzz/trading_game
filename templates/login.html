<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Login to Trading Game</h1>
    <form action="/" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input
        type="text"
        name="username"
        placeholder="Username"
        required
        maxlength="50"
        pattern="[A-Za-z0-9_]+"
      /><br />
      <input
        type="password"
        name="password"
        placeholder="Password"
        required
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
        title="Password must be at least 8 characters long, contain at least one uppercase letter, one lowercase letter, and one digit."
      /><br />
      <button
        type="submit"
        onclick="this.disabled=true; this.innerText='Logging in...'; this.form.submit();"
      >
        Login
      </button>
    </form>
  </body>
</html>
