<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .container {
        display: flex;
        justify-content: space-between;
      }
      .left,
      .right {
        width: 45%;
      }
      .ticker button {
        padding: 10px;
        margin: 5px;
      }
      #timer {
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Trading Game</h1>
    <p>User: {{ username }}</p>
    <p>Capital: $<span id="capital">{{ capital }}</span></p>
    <p id="timer">Time Left: 01:45</p>
    <div class="container">
      <div class="left">
        <img
          id="stock-image"
          src="/static/MSFT.png"
          alt="Stock Image"
          width="100%"
        />
      </div>
      <div class="right">
        <div class="ticker">
          <button onclick="selectTicker('MSFT')">MSFT</button>
          <button onclick="selectTicker('AAPL')">AAPL</button>
          <button onclick="selectTicker('GOOG')">GOOG</button>
          <button onclick="selectTicker('TSLA')">TSLA</button>
        </div>
        <button onclick="trade('Buy')">Buy</button>
        <input type="number" id="quantity" value="1" min="1" />
        <button onclick="trade('Sell')">Sell</button>
      </div>
    </div>
    <script>
      let selectedTicker = "MSFT";
      function selectTicker(ticker) {
        selectedTicker = ticker;
        document.getElementById("stock-image").src = `/static/${ticker}.png`;
      }
      function trade(action) {
        const quantity = document.getElementById("quantity").value;
        fetch("/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: "{{ username }}",
            action,
            ticker: selectedTicker,
            quantity,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("capital").innerText = data.capital;
          });
      }
    </script>
  </body>
</html>
